<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d289" />
      <stop offset="50%" stop-color="#dfb265" />
      <stop offset="100%" stop-color="#b48332" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152744" />
      <stop offset="100%" stop-color="#0a1424" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Sovereign Pentagon Accent Frame -->
  <polygon points="32,8 54,23 45,51 19,51 10,23" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35" />
  <!-- BTCC Monogram -->
  <text x="32" y="38" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="17" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.2">BTCC</text>
  <!-- Institutional Accent Star / Diamond -->
  <polygon points="32,44 34.5,47.5 32,51 29.5,47.5" fill="url(#goldGrad)" />
</svg>
